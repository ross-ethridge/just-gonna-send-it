<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Just Gonna Send It</title>
<style>
  html, body { margin: 0; height: 100%; background: #0b1a2b; overflow: hidden;
    font-family: system-ui, sans-serif; user-select: none; }
  #wrap { position: relative; width: 100vw; height: 100vh; }
  canvas { display: block; width: 100%; height: 100%; cursor: grab; }
  canvas.dragging { cursor: grabbing; }
  #hud { position: absolute; top: 14px; left: 18px; color: #fff;
    text-shadow: 0 2px 5px rgba(0,0,0,.55); pointer-events: none; }
  #hud h1 { margin: 0 0 4px; font-size: 22px; letter-spacing: 1px; font-weight: 800; }
  #hud .stat { font-size: 15px; opacity: .95; }
  #help { position: absolute; bottom: 14px; left: 18px; color: #eaf4ff;
    font-size: 13px; opacity: .85; text-shadow: 0 1px 3px rgba(0,0,0,.7); }
  #restart, #restartgame { position: absolute; top: 14px; color: #fff;
    background: rgba(255,255,255,.14); border: 1px solid rgba(255,255,255,.35);
    border-radius: 8px; padding: 8px 14px; font-size: 14px; cursor: pointer; }
  #restart { right: 18px; }
  #restartgame { right: 150px; }
  #restart:hover, #restartgame:hover { background: rgba(255,255,255,.26); }
  #win { position: absolute; inset: 0; display: none; align-items: center;
    justify-content: center; flex-direction: column; color: #fff;
    background: rgba(10,25,45,.55); pointer-events: none; }
  #win.show { display: flex; }
  #win .big { font-size: 64px; font-weight: 900; letter-spacing: 2px;
    text-shadow: 0 4px 16px rgba(0,0,0,.5); }
  #win .sub { font-size: 20px; margin-top: 8px; opacity: .9; }
  #win.over { background: rgba(40,8,8,.62); }                 /* GAME OVER: angry red wash */
  #win.over .big { color: #ff5a5a; text-shadow: 0 4px 18px rgba(0,0,0,.6); }
  /* On-screen flip buttons (touch only) — hold to rotate the sled mid-air, like ◄ ► / A,D */
  .flipbtn { position: absolute; bottom: 22px; width: 78px; height: 78px; border-radius: 50%;
    display: none; align-items: center; justify-content: center; font-size: 34px; color: #fff;
    background: rgba(255,255,255,.16); border: 2px solid rgba(255,255,255,.45);
    text-shadow: 0 2px 4px rgba(0,0,0,.5); touch-action: none; -webkit-user-select: none; user-select: none; }
  .flipbtn:active { background: rgba(255,255,255,.36); }
  #flipL { left: 20px; } #flipR { right: 20px; }
  @media (hover: none) and (pointer: coarse) {       /* phones/tablets */
    .flipbtn { display: flex; }
    #help { display: none; }                          /* keyboard hints don't apply; buttons are self-evident */
  }
  /* "Rotate to landscape" gate — best played wide. Shown only on touch devices in portrait. */
  #rotate { position: absolute; inset: 0; z-index: 50; display: none;
    flex-direction: column; align-items: center; justify-content: center; gap: 18px;
    text-align: center; padding: 28px; background: #0b1a2b; color: #fff;
    font-family: system-ui, sans-serif; font-size: 22px; font-weight: 800; letter-spacing: .5px; }
  #rotate .icon { font-size: 72px; animation: tip 1.8s ease-in-out infinite; }
  #rotate .sub { font-size: 15px; font-weight: 500; opacity: .8; }
  @keyframes tip { 0%,50% { transform: rotate(0); } 75%,100% { transform: rotate(-90deg); } }
  @media (hover: none) and (pointer: coarse) and (orientation: portrait) {
    #rotate { display: flex; }
  }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="c"></canvas>
  <div id="hud">
    <h1>🏔️ JUST GONNA SEND IT</h1>
    <div class="stat">Level <span id="level">1</span> / <span id="levels">6</span></div>
    <div class="stat">Cans down: <span id="score">0</span> / <span id="total">0</span></div>
    <div class="stat">Launches: <span id="shots">0</span> / 5</div>
  </div>
  <div id="help">Drag back &amp; release to send it off the kicker • ◄ ► / A,D to flip &amp; level out mid-air • R resets • M mutes</div>
  <button id="restartgame">⟲ Reset game</button>
  <button id="restart">↻ Retry level</button>
  <div id="flipL" class="flipbtn">◄</div>
  <div id="flipR" class="flipbtn">►</div>
  <div id="win"><div class="big">SENT IT! 🎉</div><div class="sub" id="winsub"></div></div>
  <div id="rotate"><div class="icon">📱</div><div>Turn your phone sideways<br>to send it 🛷</div><div class="sub">landscape only</div></div>
</div>

<script src="matter.min.js"></script><!-- Matter.js 0.20.0 vendored locally (no external CDN dependency) -->
<!-- Fallback: if the local copy didn't load (e.g. opening the lone file:// via a sandbox portal), pull it from the CDN -->
<script>if(typeof Matter==='undefined'){document.write('<scr'+'ipt src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.20.0/matter.min.js"><\/scr'+'ipt>');}</script>
<script>
const { Engine, Bodies, Body, Composite, Vector, Query } = Matter;

const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const scoreEl = document.getElementById('score');
const totalEl = document.getElementById('total');
const shotsEl  = document.getElementById('shots');
const levelEl = document.getElementById('level');
const winEl = document.getElementById('win');
const winSub = document.getElementById('winsub');
const winBig = document.querySelector('#win .big');

// Viewport (game units) and the wider scrolling world
const VW = 1280, VH = 720;        // visible camera size
const WORLD_W = 4800;             // total level width (long run-out for the side-scroll)
const GROUND_Y = VH - 70;

const ANCHOR = { x: 200, y: GROUND_Y - 18 };          // sled start (long runway before the kicker)
// Kicker launcher = a steep concave arc that flings the sled into a big spinning
// backflip jump. (A truly rideable loop traps the sled in 2D physics, so the crazy
// flips come from a steep kicker + mid-air rotation control instead.)
const RAMP = { x0: 980, R: 560, theta: 0.52 };          // ~30° kicker — LONG & GENTLE (big R, lower angle, starts earlier) so it doesn't pitch the nose up at part power
RAMP.x1   = RAMP.x0 + RAMP.R * Math.sin(RAMP.theta);
RAMP.topY = GROUND_Y - RAMP.R * (1 - Math.cos(RAMP.theta));
const LIP = { x: RAMP.x1, y: RAMP.topY };               // takeoff point
// Ramp→castle distance, PER LEVEL (the ~71 mph arc lands ~3220; towers sit in its steep
// descent zone so the sled drops INTO them rather than cresting over). Tune each level here.
const LEVEL_X = [2900, 2900, 2900, 2900, 2900, 2900];   // centre of the (gentler-ramp) reachable band; towers spread ±~360 so each needs its own power
const canX = () => LEVEL_X[level];
const LAUNCH_EFF = 0.72;                                // measured: lip speed ≈ 0.72 × launch (ramp loss)

// Tunables (real scale: 11.2 px/ft, g≈0.10/step². 60 mph ≈ 16.4 px/step; full pull ≈ 66 mph)
const POWER = 0.05;            // drag -> launch speed
const MAX_DRAG = 390;          // full send ~71 mph — reaches the FAR towers; near ones need a softer pull (that's the aim)

// Point on the ramp surface for arc parameter phi (0..theta)
function rampSurface(phi) {
  return { x: RAMP.x0 + RAMP.R * Math.sin(phi),
           y: GROUND_Y - RAMP.R * (1 - Math.cos(phi)) };
}

// Uniform-scale + letterbox so geometry never distorts on resize
const view = { scale: 1, offX: 0, offY: 0, dpr: 1 };
function resize() {
  const dpr = window.devicePixelRatio || 1;
  const cssW = window.innerWidth, cssH = window.innerHeight;
  canvas.width = Math.round(cssW * dpr); canvas.height = Math.round(cssH * dpr);
  canvas.style.width = cssW + 'px'; canvas.style.height = cssH + 'px';
  view.dpr = dpr;
  view.scale = Math.min(cssW / VW, cssH / VH);       // uniform -> preserves aspect ratio
  view.offX = (cssW - VW * view.scale) / 2;          // centre with letterbox bars
  view.offY = (cssH - VH * view.scale) / 2;
}
window.addEventListener('resize', resize);

// Screen pixel -> world coords (invert letterbox transform + camera scroll)
function toWorld(e) {
  const r = canvas.getBoundingClientRect();
  const gx = (e.clientX - r.left - view.offX) / view.scale;
  const gy = (e.clientY - r.top  - view.offY) / view.scale;
  return { x: gx + cam.x, y: gy + cam.y };
}

// ---- State ----
let engine, world, sled, cans = [], blocks = [], burstP = [];
let state = 'aim';                       // 'aim' | 'fly'
let score = 0, shots = 0, dragWorld = null, dragging = false, restT = 0, launchBoosted = false, level = 0;
let celebrating = false, celebrateBig = false, celebrateT = 0, prevAirborne = false;
let winPending = false, winT = 0;        // beat between the last can falling and Larry hopping off
let gameOver = false, overT = 0;         // GAME OVER state (failed to clear a level in MAX_TRIES launches)
const MAX_TRIES = 5;
const cam = { x: 0, y: 0 };

// Ambient falling snow (screen-space, cosmetic)
const snow = Array.from({ length: 90 }, () => ({
  x: Math.random()*VW, y: Math.random()*VH,
  r: 1 + Math.random()*2.2, s: 0.4 + Math.random()*1.1, drift: Math.random()*0.6-0.3
}));
// World trees (scroll with the level)
const treeXs = [80, 560, 1050, 1500, 1850, 2400];

function makeSled() {
  const b = Bodies.rectangle(ANCHOR.x, ANCHOR.y, 112, 34, {
    label: 'sled', density: 0.006, friction: 0.004, frictionAir: 0.0006,
    restitution: 0, chamfer: { radius: 10 }     // mass tuned to topple ONE tower without bulldozing the whole row
  });
  Body.setStatic(b, true);
  Composite.add(world, b);
  return b;
}

// ---- Level structures. B=addBlock(x,y,w,h,ang,opts)  C=addCan(x,baseY)  G=ground  X=centre ----
function post(B, cx, baseY, h, o) { B(cx, baseY - h/2, 19, h, 0, o); return baseY - h; }   // plank (dynamic unless o.fixed)
function stonePost(B, cx, baseY, h) { B(cx, baseY - h/2, 22, h, 0, {mat:'stone'}); return baseY - h; } // immovable stone footing
function beam(B, cx, topY, w, o) { B(cx, topY - 7, w, 14, 0, o); return topY - 14; }        // board, returns its top
const STONE_H = 56;       // short immovable stone footing height (so a ground-scrape can't auto-win)
const PH = 92;            // plank/floor height of a tower cell
// ---- Angry-Birds-style stacked-plank towers (DYNAMIC: they topple & scatter when hit) ----
// A stack of open "cells" (two planks + a board): beers perch on the roof and a couple inside.
// Knock the tower over and the beers tumble. Several spread towers per level, so one shot
// topples ~one tower and you chip the rest down over a few shots.
const METAL = { mat: 'metal' };                   // heavy red construction beam
// metalWalls = number of LOWEST floors whose WALLS (posts) are heavy red metal — a reinforced,
// harder-to-topple tower (you need a stronger / better-aimed hit). 0 = plain wood.
function tower(B, C, X, G, floors, hw, metalWalls=0) {
  let y = G;
  stonePost(B, X-hw, y, STONE_H); stonePost(B, X+hw, y, STONE_H);   // immovable footing (can't win by plowing the base)
  y = beam(B, X, y - STONE_H, hw*2 + 28);
  for (let f = 0; f < floors; f++) {
    if (f % 2 === 0) C(X, y);                   // a beer boxed inside every other floor
    const wall = (f < metalWalls) ? METAL : undefined;
    post(B, X-hw, y, PH, wall); post(B, X+hw, y, PH, wall);
    // every other ceiling is a heavy red METAL beam — when the tower goes, it slams down on the beer below
    y = beam(B, X, y - PH, hw*2 + 28, (f % 2 === 1) ? METAL : undefined);
  }
  C(X, y);                                       // a beer on the roof
  return y;
}
// a board platform bridging two towers' tops, with a beer or two riding it (a heavy metal girder)
function deck(B, C, x1, x2, y, n=2) {
  const cx=(x1+x2)/2, w=Math.abs(x2-x1), top=beam(B,cx,y,w+80,METAL);
  for (let i=0;i<n;i++) C(x1 + (x2-x1)*(i+1)/(n+1), top);
  return top;
}
// Angry-Birds skylines of SEPARATE towers spread across the reachable band. A near tower needs
// a soft pull, a far one a full send, so each tower is its own aimed shot — you can't sweep the
// whole level in one go. Towers topple & scatter (metal ceiling beams crash onto the beers below).
const LEVELS = [
  // 1 — one tower (warm-up)
  (B,C,G,ch,X) => tower(B,C,X,G,3,40),
  // 2 — a near tower + a far tower
  (B,C,G,ch,X) => { tower(B,C,X-230,G,3,38); tower(B,C,X+230,G,4,38); },
  // 3 — two spread, one reinforced with a metal-walled base
  (B,C,G,ch,X) => { tower(B,C,X-235,G,4,38,1); tower(B,C,X+235,G,3,38); },
  // 4 — three spread; the tall middle one is reinforced
  (B,C,G,ch,X) => { tower(B,C,X-345,G,3,38); tower(B,C,X,G,5,40,2); tower(B,C,X+345,G,3,38); },
  // 5 — three spread, two reinforced
  (B,C,G,ch,X) => { tower(B,C,X-345,G,4,38,2); tower(B,C,X,G,3,38); tower(B,C,X+345,G,5,40,2); },
  // 6 — three wide towers, all reinforced (hard)
  (B,C,G,ch,X) => { tower(B,C,X-360,G,4,38,2); tower(B,C,X,G,5,40,3); tower(B,C,X+360,G,4,38,2); },
];

function buildLevel() {
  engine = Engine.create();
  engine.gravity.y = 0.364;        // ≈ real gravity at ~11 px/ft scale (snowmobile ≈ 10 ft)
  world = engine.world;
  cans = []; blocks = []; burstP = [];
  score = 0; shots = 0; state = 'aim'; dragging = false; dragWorld = null; restT = 0;
  celebrating = false; winPending = false; winT = 0; gameOver = false; overT = 0;
  cam.x = 0; cam.y = 0;
  winEl.classList.remove('show', 'over');

  const ground = Bodies.rectangle(WORLD_W/2, GROUND_Y + 80, WORLD_W + 600, 160,
    { isStatic: true, label: 'ground', friction: 0.008 });
  // ---- Kicker arc launcher ----
  const segs = [];
  const N = 38;
  for (let i = 0; i < N; i++) {
    const phi = RAMP.theta * (i + 0.5) / N;
    const P = rampSurface(phi);
    const T = 64;
    const cx = P.x + Math.sin(phi) * T/2;
    const cy = P.y + Math.cos(phi) * T/2;
    const L = (RAMP.R * RAMP.theta / N) * 1.9;
    segs.push(Bodies.rectangle(cx, cy, L, T,
      { isStatic: true, label: 'ramp', angle: -phi, friction: 0.008, restitution: 0 }));
  }
  Composite.add(world, [ground, ...segs]);

  // ---- Destructible structure: wooden supports with cans perched to cascade ----
  const cw = 38, ch = 70, G = GROUND_Y;
  const addBlock = (x, y, w, h, ang=0, opts={}) => {
    const fixed = opts.mat === 'stone' || opts.fixed;     // stone footing is STATIC; everything else falls
    const metal = opts.mat === 'metal';                   // heavy red construction beam — crushes what's below when it drops
    const b = Bodies.rectangle(x, y, w, h, { label:'block', density: metal ? 0.0028 : 0.0018, angle:ang,
      isStatic: fixed, friction:0.98, frictionStatic:9, restitution:0, chamfer:{ radius:2 } });
    b.w = w; b.h = h; b.mat = opts.mat || 'wood';
    blocks.push(b); Composite.add(world, b); return b;
  };
  const addCan = (x, baseY) => {
    const c = Bodies.rectangle(x, baseY - ch/2, cw, ch, { label:'can', density:0.0012,
      friction:0.92, frictionStatic:8, restitution:0, chamfer:{ radius:4 } });   // sit firmly, but a heavy sled still scatters them
    c.knocked = false; c.hue = 40 + Math.random()*20;
    c.ox = x; c.oy = baseY - ch/2;                    // remember start, to detect being shoved
    cans.push(c); Composite.add(world, c); return c;
  };
  LEVELS[level](addBlock, addCan, G, ch, canX());     // build this level's tower(s) at its own distance
  sled = makeSled();
  totalEl.textContent = cans.length;
  levelEl.textContent = level + 1;
  updateHud();
}
function updateHud() { scoreEl.textContent = score; shotsEl.textContent = shots; }

// ---- Input ----
canvas.addEventListener('mousedown', e => startDrag(e));
canvas.addEventListener('touchstart', e => { startDrag(e.touches[0]); e.preventDefault(); }, {passive:false});
window.addEventListener('mousemove', e => moveDrag(e));
window.addEventListener('touchmove', e => { if (dragging){ moveDrag(e.touches[0]); e.preventDefault(); } }, {passive:false});
window.addEventListener('mouseup', endDrag);
window.addEventListener('touchend', endDrag);

function startDrag(e) {
  if (state !== 'aim') return;
  const p = toWorld(e);
  if (Vector.magnitude(Vector.sub(p, sled.position)) < 160) {
    dragging = true; dragWorld = p; canvas.classList.add('dragging');
  }
}
function moveDrag(e) { if (dragging) dragWorld = toWorld(e); }
function endDrag() {
  if (!dragging) return;
  dragging = false; canvas.classList.remove('dragging');
  const dist = Vector.magnitude(Vector.sub(sled.position, dragWorld)); // drag in ANY direction
  if (dist < 14) { dragWorld = null; return; }        // tiny drag cancels
  const speed = Math.min(dist, MAX_DRAG) * POWER;
  Body.setStatic(sled, false);
  Body.setVelocity(sled, { x: speed, y: 0 });          // gun it straight down the flats
  Body.setAngularVelocity(sled, 0);
  state = 'fly'; shots++; restT = 0; dragWorld = null; launchBoosted = false;
  sndRev();
  updateHud();
}
document.getElementById('restart').addEventListener('click', buildLevel);
document.getElementById('restartgame').addEventListener('click', () => { level = 0; buildLevel(); });
// ---- Keyboard: R resets; arrows / A,D control rotation in the air ----
const keys = { left: false, right: false };
window.addEventListener('keydown', e => {
  if (e.key === 'r' || e.key === 'R') buildLevel();
  if (e.key === 'm' || e.key === 'M') { muted = !muted; if (muted) engineStop(); }
  if (e.key === 'ArrowLeft'  || e.key === 'a' || e.key === 'A') { keys.left  = true; e.preventDefault(); }
  if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') { keys.right = true; e.preventDefault(); }
});
window.addEventListener('keyup', e => {
  if (e.key === 'ArrowLeft'  || e.key === 'a' || e.key === 'A') keys.left  = false;
  if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') keys.right = false;
});
// ---- Touch flip buttons: hold to rotate, same as the arrow keys ----
function holdFlip(id, side) {
  const el = document.getElementById(id);
  const set = on => e => { keys[side] = on; e.preventDefault(); e.stopPropagation(); };
  el.addEventListener('pointerdown',   set(true));
  el.addEventListener('pointerup',     set(false));
  el.addEventListener('pointercancel', set(false));
  el.addEventListener('pointerleave',  set(false));
}
holdFlip('flipL', 'left');
holdFlip('flipR', 'right');

// ---- Scoring ----
function angleOff(a){ let m = ((a % Math.PI)+Math.PI)%Math.PI; return Math.min(m, Math.PI-m); }
function checkCans() {
  for (const can of cans) {
    if (can.knocked) continue;
    const moved = Math.hypot(can.position.x - can.ox, can.position.y - can.oy);
    if (angleOff(can.angle) > 0.4 || moved > 26) {     // tipped or clearly displaced (all cans are elevated now)
      can.knocked = true; score++; burst(can.position.x, can.position.y); sndClatter(); updateHud();
    }
  }
  if (score === cans.length && !celebrating && !winPending) {
    // Last can down — DON'T celebrate yet. Let the sled finish its flight and the cans
    // settle; the loop counts down winT and calls startCelebration() once the dust settles.
    winPending = true; winT = 0;
  }
}
function startCelebration() {
  winPending = false;
  const last = level >= LEVELS.length - 1;
  winBig.textContent = last ? 'SENT IT ALL! 🍻' : 'SEND IT! 🍻';
  winSub.textContent = last
    ? `All ${LEVELS.length} levels cleared — absolute legend.`
    : `Level ${level+1} cleared in ${shots} launch${shots===1?'':'es'}! Larry says cheers.`;
  winEl.classList.add('show');
  // ---- celebration: Larry hops off and cheers ----
  engineStop();
  celebrating = true; celebrateBig = last; celebrateT = 0;
  Body.setStatic(sled, true); Body.setAngularVelocity(sled, 0); Body.setAngle(sled, 0);
  Body.setPosition(sled, { x: sled.position.x, y: GROUND_Y - 18 });
  confetti(sled.position.x, sled.position.y - 50, last ? 90 : 45);
  sndAirhorn(); sndCrowd(last ? 4 : 2.4);
  if (last) { setTimeout(sndAirhorn, 350); setTimeout(sndAirhorn, 700); }
  setTimeout(() => { level = last ? 0 : level + 1; buildLevel(); }, last ? 5000 : 2900);
}
const FAIL_SUBS = [
  "Larry did NOT send it.",
  "The cans remain undefeated. 🍺",
  "Maybe ease up on the beers next time, bud.",
  "5 launches, 0 glory. Brutal.",
  "That one's gonna leave a mark.",
];
function startGameOver() {
  engineStop();
  gameOver = true; overT = 0;
  winBig.textContent = 'GAME OVER 💀';
  winSub.textContent = FAIL_SUBS[Math.floor(Math.random()*FAIL_SUBS.length)] + ` (Level ${level+1} — ${score}/${cans.length} cans)`;
  winEl.classList.add('show', 'over');
  // freeze a crashed wreck right in front of the towers that beat him, with the crowd watching
  Body.setStatic(sled, true); Body.setVelocity(sled, {x:0,y:0}); Body.setAngularVelocity(sled, 0);
  Body.setAngle(sled, Math.PI * 0.88);                 // flipped on its back
  Body.setPosition(sled, { x: canX() - 150, y: GROUND_Y - 10 });
  sndFail();
  // back to square one after the shame sinks in
  setTimeout(() => { level = 0; buildLevel(); }, 5200);
}

// ---- Particles ----
function burst(x,y){ for(let i=0;i<16;i++){ const a=Math.random()*Math.PI*2, s=2+Math.random()*5;
  burstP.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-2,life:1,c:Math.random()<.5?'#ffd34d':'#fff'});}}
function spray(x,y){ for(let i=0;i<2;i++)
  burstP.push({x,y,vx:(Math.random()-0.5)*4,vy:-Math.random()*4-1,life:1,c:'#fff'}); }
const CONFETTI = ['#ff5fa6','#ffd23a','#34d1c2','#7b61ff','#ff7a3c','#52e36b','#ffffff'];
function confetti(x,y,n){ for(let i=0;i<n;i++){ const a=Math.random()*Math.PI*2, s=3+Math.random()*8;
  burstP.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-7,life:1,c:CONFETTI[(Math.random()*CONFETTI.length)|0]});}}

// ---- Sound (Web Audio, all synthesized — no files) ----
let actx = null, muted = false;
function audio(){ if(!actx){ try{ actx = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} }
  if(actx && actx.state==='suspended') actx.resume(); return actx; }
['pointerdown','keydown','touchstart'].forEach(ev => window.addEventListener(ev, audio));
function tone(freq, dur, type, gain, slideTo){
  const a=audio(); if(!a||muted) return; const t=a.currentTime;
  const o=a.createOscillator(), g=a.createGain();
  o.type=type||'sine'; o.frequency.setValueAtTime(freq,t);
  if(slideTo) o.frequency.exponentialRampToValueAtTime(slideTo,t+dur);
  g.gain.setValueAtTime(gain||0.2,t); g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  o.connect(g).connect(a.destination); o.start(t); o.stop(t+dur);
}
function noiseBurst(dur, gain, hp){
  const a=audio(); if(!a||muted) return; const t=a.currentTime;
  const n=Math.floor(a.sampleRate*dur), buf=a.createBuffer(1,n,a.sampleRate), d=buf.getChannelData(0);
  for(let i=0;i<n;i++) d[i]=Math.random()*2-1;
  const src=a.createBufferSource(); src.buffer=buf;
  const f=a.createBiquadFilter(); f.type='highpass'; f.frequency.value=hp||1500;
  const g=a.createGain(); g.gain.setValueAtTime(gain||0.2,t); g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  src.connect(f).connect(g).connect(a.destination); src.start(t); src.stop(t+dur);
}
// Continuous snowmobile engine: a sawtooth drone with an RPM wobble (LFO) that runs the
// whole flight; its pitch tracks the sled's speed (revs up fast, idles when slow).
let engineNodes = null;
function engineStart(){
  const a=audio(); if(!a||muted||engineNodes) return; const t=a.currentTime;
  const o=a.createOscillator(), g=a.createGain(), f=a.createBiquadFilter();
  o.type='sawtooth'; o.frequency.setValueAtTime(120,t);
  f.type='lowpass'; f.frequency.value=1300;
  const lfo=a.createOscillator(), lfoG=a.createGain();      // RPM oscillation
  lfo.type='sine'; lfo.frequency.value=11; lfoG.gain.value=30; lfo.connect(lfoG).connect(o.frequency);
  g.gain.setValueAtTime(0.0001,t); g.gain.linearRampToValueAtTime(0.14,t+0.06);
  o.connect(f).connect(g).connect(a.destination); o.start(t); lfo.start(t);
  engineNodes={o,g,f,lfo,lfoG};
}
function engineRev(speed){                  // call each frame: pitch follows speed
  if(!engineNodes) return; const a=audio(); if(!a) return;
  engineNodes.o.frequency.setTargetAtTime(85 + Math.min(speed,42)*4.2, a.currentTime, 0.06);
  engineNodes.lfo.frequency.setTargetAtTime(8 + Math.min(speed,42)*0.4, a.currentTime, 0.1);   // faster wobble when revving
}
function engineStop(){
  if(!engineNodes) return; const a=audio(), t=a?a.currentTime:0;
  try{ engineNodes.g.gain.cancelScheduledValues(t); engineNodes.g.gain.setTargetAtTime(0.0001,t,0.07);
       engineNodes.o.stop(t+0.35); engineNodes.lfo.stop(t+0.35); }catch(e){}
  engineNodes=null;
}
function sndRev(){                          // one-shot snowmobile rev on launch (with RPM wobble)
  const a=audio(); if(!a||muted) return; const t=a.currentTime;
  const o=a.createOscillator(), g=a.createGain(), f=a.createBiquadFilter();
  o.type='sawtooth';
  o.frequency.setValueAtTime(80,t); o.frequency.linearRampToValueAtTime(265,t+0.3); o.frequency.linearRampToValueAtTime(175,t+0.9);
  f.type='lowpass'; f.frequency.value=1300;
  const lfo=a.createOscillator(), lfoG=a.createGain(); lfo.type='sine'; lfo.frequency.value=22; lfoG.gain.value=42; lfo.connect(lfoG).connect(o.frequency);
  g.gain.setValueAtTime(0.0001,t); g.gain.linearRampToValueAtTime(0.17,t+0.05); g.gain.setValueAtTime(0.17,t+0.55); g.gain.exponentialRampToValueAtTime(0.0001,t+0.9);
  o.connect(f).connect(g).connect(a.destination); o.start(t); lfo.start(t); o.stop(t+0.9); lfo.stop(t+0.9);
}
let lastClatter = 0;
function sndClatter(){                      // a can getting knocked (throttled for mass collapses)
  const now = performance.now(); if (now - lastClatter < 28) return; lastClatter = now;
  noiseBurst(0.07, 0.12, 1400+Math.random()*1600);
  tone(420+Math.random()*520, 0.11, 'square', 0.05, 180);
}
function sndAirhorn(){                       // big celebration honk
  tone(311, 0.55, 'square', 0.14);
  tone(415, 0.55, 'square', 0.11);
  tone(622, 0.55, 'sawtooth', 0.06);
}
function sndCrowd(dur){                       // a roaring crowd of Kennys (noise swell + whoops)
  const a=audio(); if(!a||muted) return; const t=a.currentTime; dur=dur||2.2;
  const n=Math.floor(a.sampleRate*dur), buf=a.createBuffer(1,n,a.sampleRate), d=buf.getChannelData(0);
  for(let i=0;i<n;i++) d[i]=Math.random()*2-1;
  const src=a.createBufferSource(); src.buffer=buf;
  const f=a.createBiquadFilter(); f.type='bandpass'; f.frequency.value=950; f.Q.value=0.7;
  const g=a.createGain();
  g.gain.setValueAtTime(0.0001,t); g.gain.linearRampToValueAtTime(0.2,t+0.3);
  g.gain.setValueAtTime(0.2,t+dur*0.6); g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  const lfo=a.createOscillator(), lfoG=a.createGain();   // "many voices" tremolo
  lfo.type='sine'; lfo.frequency.value=7; lfoG.gain.value=0.06; lfo.connect(lfoG).connect(g.gain);
  src.connect(f).connect(g).connect(a.destination); src.start(t); src.stop(t+dur); lfo.start(t); lfo.stop(t+dur);
  for(let i=0;i<4;i++){ const ts=0.1+Math.random()*dur*0.7;                       // muffled whoops/whistles
    setTimeout(()=>tone(1100+Math.random()*900, 0.18, 'sine', 0.05, 1700+Math.random()*600), ts*1000); }
}
function sndThud(){ noiseBurst(0.12,0.16,180); tone(95,0.16,'sine',0.14,55); }
function sndFail(){                           // sad trombone: womp-womp-womp-wommmp

function stepParticles(){ for(const p of burstP){p.x+=p.vx;p.y+=p.vy;p.vy+=0.18;p.life-=0.022;}
  burstP = burstP.filter(p=>p.life>0); }
function stepSnow(){ for(const f of snow){ f.y+=f.s; f.x+=f.drift;
  if(f.y>VH){f.y=-4;f.x=Math.random()*VW;} if(f.x<0)f.x+=VW; if(f.x>VW)f.x-=VW; } }

// ---- Camera ----
function clamp(v,a,b){ return Math.max(a, Math.min(b, v)); }
function stepCamera() {
  let tx = (state === 'aim')                         // in aim, sit the sled ~45% across for pull-back room
    ? sled.position.x - VW*0.45
    : clamp(sled.position.x - VW*0.32, 0, WORLD_W - VW);
  tx = clamp(tx, -520, WORLD_W - VW);
  const ty = clamp(sled.position.y - VH*0.62, -360, 0);
  cam.x += (tx - cam.x) * 0.09;
  cam.y += (ty - cam.y) * 0.09;
}

// True only when EVERYTHING has stopped moving — the sled AND every can/board.
// (So we don't reset or celebrate while cans are still tumbling.)
function sceneSettled() {
  if (Vector.magnitude(sled.velocity) >= 0.45 || Math.abs(sled.angularVelocity) >= 0.04) return false;
  for (const c of cans)   if (Vector.magnitude(c.velocity) >= 0.4 || Math.abs(c.angularVelocity) >= 0.05) return false;
  for (const b of blocks) if (!b.isStatic && (Vector.magnitude(b.velocity) >= 0.4 || Math.abs(b.angularVelocity) >= 0.05)) return false;
  return true;
}
// ---- Respawn after the whole scene settles or the sled leaves the world ----
function maybeRespawn(dt) {
  if (state !== 'fly') return;
  const off = sled.position.x > WORLD_W+300 || sled.position.x < -300 || sled.position.y > VH+400;
  restT = sceneSettled() ? restT + dt : 0;       // only count rest once nothing is still wobbling
  if (off || restT > 700) {
    if (shots >= MAX_TRIES && score < cans.length) { startGameOver(); return; }   // out of tries, level not cleared
    engineStop(); Composite.remove(world, sled); sled = makeSled(); state = 'aim';
  }
}

// ================= RENDER =================
function rr(x,y,w,h,r){ ctx.beginPath(); ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }
function local(body, draw){ ctx.save(); ctx.translate(body.position.x, body.position.y);
  ctx.rotate(body.angle); draw(); ctx.restore(); }

function sky() {
  const g = ctx.createLinearGradient(0,0,0,VH);
  g.addColorStop(0,'#8fc7ff'); g.addColorStop(.55,'#bfe2ff'); g.addColorStop(1,'#eaf6ff');
  ctx.fillStyle=g; ctx.fillRect(0,0,VW,VH);
  const s = ctx.createRadialGradient(VW-220,130,10,VW-220,130,160);
  s.addColorStop(0,'rgba(255,255,240,.9)'); s.addColorStop(1,'rgba(255,255,240,0)');
  ctx.fillStyle=s; ctx.fillRect(VW-440,-40,440,360);
}
function mountains(baseY, col, par) {
  ctx.save(); ctx.translate(-cam.x*par, -cam.y*par*0.5);
  ctx.fillStyle = col; ctx.beginPath(); ctx.moveTo(-200, baseY);
  const pts=[[60,baseY-120],[260,baseY-260],[460,baseY-90],[700,baseY-300],
    [980,baseY-150],[1280,baseY-330],[1620,baseY-120],[2000,baseY-220]];
  for(const [x,y] of pts) ctx.lineTo(x,y);
  ctx.lineTo(2200, GROUND_Y+300); ctx.lineTo(-200, GROUND_Y+300); ctx.closePath(); ctx.fill();
  ctx.fillStyle='rgba(255,255,255,.6)';
  for(const [x,y] of pts){ ctx.beginPath(); ctx.moveTo(x,y);
    ctx.lineTo(x-22,y+34); ctx.lineTo(x+22,y+34); ctx.closePath(); ctx.fill(); }
  ctx.restore();
}
function tree(x, sc){ ctx.save(); ctx.translate(x, GROUND_Y); ctx.scale(sc,sc);
  ctx.fillStyle='#6b4a2b'; ctx.fillRect(-5,-18,10,18); ctx.fillStyle='#2f6b46';
  for(let i=0;i<3;i++){ const w=46-i*10,y=-18-i*26; ctx.beginPath();
    ctx.moveTo(0,y-34); ctx.lineTo(-w,y); ctx.lineTo(w,y); ctx.closePath(); ctx.fill(); }
  ctx.fillStyle='rgba(255,255,255,.85)';
  for(let i=0;i<3;i++){ const w=46-i*10,y=-18-i*26; ctx.beginPath();
    ctx.moveTo(0,y-34); ctx.lineTo(-w*0.5,y-12); ctx.lineTo(w*0.2,y-12); ctx.closePath(); ctx.fill(); }
  ctx.restore(); }

function ground() {
  ctx.fillStyle='#fdfeff'; ctx.fillRect(-700, GROUND_Y, WORLD_W+1400, VH-GROUND_Y+300);
  ctx.fillStyle='#eef5fb'; ctx.fillRect(-700, GROUND_Y, WORLD_W+1400, 6);
}
function drawRamp() {
  const { x0, x1, topY } = RAMP, STEPS = 26;
  const pts = []; for (let i=0;i<=STEPS;i++) pts.push(rampSurface(RAMP.theta*i/STEPS));
  // solid wooden body under the curve
  ctx.fillStyle = '#7a5230'; ctx.beginPath(); ctx.moveTo(x0, GROUND_Y);
  for (const p of pts) ctx.lineTo(p.x, p.y);
  ctx.lineTo(x1, GROUND_Y); ctx.closePath(); ctx.fill();
  // plank lines on the vertical back face
  ctx.strokeStyle = 'rgba(0,0,0,.15)'; ctx.lineWidth = 2;
  for (let y = GROUND_Y - 18; y > topY + 8; y -= 18) { ctx.beginPath(); ctx.moveTo(x1-46, y); ctx.lineTo(x1, y); ctx.stroke(); }
  // snowy curved surface
  ctx.strokeStyle = '#fff'; ctx.lineWidth = 10; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  ctx.beginPath(); pts.forEach((p,i)=> i?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y)); ctx.stroke();
  // outline
  ctx.strokeStyle = '#5c3d22'; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.moveTo(x0, GROUND_Y);
  for (const p of pts) ctx.lineTo(p.x, p.y);
  ctx.lineTo(x1, GROUND_Y); ctx.stroke();
}
// Powerpuff-style: flat bold fills + clean black outlines + big eyes
const INK = '#1c1530';
function fillOutline(fill, lw) { ctx.fillStyle = fill; ctx.fill(); ctx.lineJoin='round'; ctx.lineCap='round'; ctx.strokeStyle = INK; ctx.lineWidth = lw||3; ctx.stroke(); }
function drawSnowmobile(body) {
  local(body, () => {
    // ground shadow
    ctx.fillStyle='rgba(28,21,48,.12)'; ctx.beginPath(); ctx.ellipse(2,23,60,9,0,0,Math.PI*2); ctx.fill();
    // front ski (bold black with a flat highlight)
    ctx.beginPath(); ctx.moveTo(16,23); ctx.lineTo(58,23); ctx.quadraticCurveTo(78,23,75,5);
    ctx.lineCap='round'; ctx.lineJoin='round'; ctx.strokeStyle=INK; ctx.lineWidth=9; ctx.stroke();
    ctx.beginPath(); ctx.moveTo(20,23); ctx.lineTo(58,23); ctx.strokeStyle='#5a5566'; ctx.lineWidth=3; ctx.stroke();
    // rear track
    ctx.beginPath(); rr(-62,3,56,21,9); fillOutline('#2c2740', 3);
    ctx.strokeStyle='#544f63'; ctx.lineWidth=2.5;
    for(let i=-54;i<-12;i+=9){ ctx.beginPath(); ctx.moveTo(i,6); ctx.lineTo(i,21); ctx.stroke(); }
    // body — flat teal, chunky rounded cowl
    ctx.beginPath();
    ctx.moveTo(-54,8); ctx.lineTo(-54,-6);
    ctx.quadraticCurveTo(-54,-18,-42,-18);
    ctx.lineTo(12,-18); ctx.quadraticCurveTo(30,-18,40,-5);
    ctx.lineTo(56,5); ctx.quadraticCurveTo(45,13,30,13);
    ctx.lineTo(-44,13); ctx.quadraticCurveTo(-54,13,-54,8); ctx.closePath();
    fillOutline('#e23b3b', 3.5);
    // flat highlight stripe (white racing stripe)
    ctx.beginPath(); rr(-46,-13,78,6,3); ctx.fillStyle='#ffffff'; ctx.fill();
    // headlight
    ctx.beginPath(); ctx.arc(47,3,4.5,0,Math.PI*2); fillOutline('#ffe45e', 2.5);
    // windshield
    ctx.beginPath(); ctx.moveTo(14,-18); ctx.quadraticCurveTo(30,-37,33,-18); ctx.closePath(); fillOutline('#cdeeff', 2.5);
    // seat
    ctx.beginPath(); rr(-52,-22,30,10,5); fillOutline('#2c2740', 2.5);
    // handlebar
    ctx.beginPath(); ctx.moveTo(15,-14); ctx.lineTo(7,-30); ctx.strokeStyle=INK; ctx.lineWidth=4; ctx.lineCap='round'; ctx.stroke();
    if (!celebrating) drawRider();          // during the celebration Larry has hopped off
  });
}

  for (const ex of [-6,6]) { ctx.beginPath(); ctx.moveTo(ex-3,-4); ctx.lineTo(ex+3,2); ctx.moveTo(ex+3,-4); ctx.lineTo(ex-3,2); ctx.stroke(); }
  // mustache + woozy mouth
  ctx.strokeStyle='#6b4a2a'; ctx.lineWidth=4; ctx.beginPath(); ctx.moveTo(-7,7); ctx.quadraticCurveTo(0,11,7,7); ctx.stroke();
  // orange aviators knocked askew up on the forehead
  ctx.save(); ctx.translate(0,-11); ctx.rotate(0.28);
  ctx.beginPath(); rr(-12,-3,24,6,2); fillOutline('#ff7b1a',1.8); ctx.restore();
  // dizzy stars orbiting overhead
  ctx.fillStyle='#ffd84a'; ctx.font='900 14px system-ui'; ctx.textAlign='center'; ctx.textBaseline='middle';
  for (let i=0;i<3;i++){ const a=t*0.02 + i*Math.PI*2/3; ctx.fillText('★', Math.cos(a)*20, -20 + Math.sin(a)*6); }
  ctx.textBaseline='alphabetic';
}
function drawWreck(cx, groundY, t) {
  ctx.save();
  ctx.translate(cx, groundY);
  ctx.lineJoin='round'; ctx.lineCap='round';
  const tw = Math.sin(t*0.006)*4;                                // feeble leg twitch
  ctx.fillStyle='rgba(28,21,48,.14)'; ctx.beginPath(); ctx.ellipse(-4,-3,54,7,0,0,Math.PI*2); ctx.fill();
  // legs (jeans) flopped up in the air, boots on top
  ctx.strokeStyle=INK;       ctx.lineWidth=15; ctx.beginPath(); ctx.moveTo(18,-14); ctx.lineTo(38,-32+tw); ctx.moveTo(22,-12); ctx.lineTo(48,-20-tw); ctx.stroke();
  ctx.strokeStyle='#5f86bd'; ctx.lineWidth=11; ctx.beginPath(); ctx.moveTo(18,-14); ctx.lineTo(38,-32+tw); ctx.moveTo(22,-12); ctx.lineTo(48,-20-tw); ctx.stroke();
  ctx.beginPath(); rr(34,-39+tw,13,9,3); fillOutline('#2c2740',2); ctx.beginPath(); rr(44,-26-tw,13,9,3); fillOutline('#2c2740',2);
  // torso lying flat on its back (denim)
  ctx.beginPath(); rr(-30,-26,54,22,9); fillOutline('#7ba6da',3);
  // splayed arm flopped out to the side
  ctx.strokeStyle=INK;       ctx.lineWidth=13; ctx.beginPath(); ctx.moveTo(-20,-10); ctx.lineTo(-42,2); ctx.stroke();
  ctx.strokeStyle='#7ba6da'; ctx.lineWidth=10; ctx.beginPath(); ctx.moveTo(-20,-10); ctx.lineTo(-42,2); ctx.stroke();
  ctx.beginPath(); ctx.arc(-44,3,5,0,Math.PI*2); fillOutline('#ffd0a0',2.2);
  // spilled beer + puddle by the hand
  ctx.fillStyle='rgba(255,210,74,.45)'; ctx.beginPath(); ctx.ellipse(-60,4,17,4,0,0,Math.PI*2); ctx.fill();
  ctx.save(); ctx.translate(-56,-1); ctx.rotate(-0.6); ctx.beginPath(); rr(-6,-10,12,20,3); fillOutline('#ffd23a',2.2); ctx.restore();
  // dazed head at the upper-left, lying back
  ctx.save(); ctx.translate(-40,-22); drawDazedHead(t); ctx.restore();
  ctx.restore();
}
// ---- Kenny-from-South-Park spectator (orange parka, hood, only eyes peeking out) ----
// cheer=true: jumping & arms up.  cheer=false: arms down, slow disappointed head-shake.
function drawKenny(t, phase, cheer=true) {
  const hop  = cheer ? Math.abs(Math.sin(t*0.013 + phase)) * 7 : 0;
  const wave = cheer ? Math.sin(t*0.02 + phase) * 6 : 0;
  const sway = cheer ? 0 : Math.sin(t*0.005 + phase) * 2.4;     // "tsk tsk" head shake
  const ORANGE='#f7621b', FUR='#7a4a28';
  ctx.save();
  ctx.translate(sway, -hop);
  ctx.lineJoin='round'; ctx.lineCap='round';
  ctx.fillStyle='rgba(28,21,48,.12)'; ctx.beginPath(); ctx.ellipse(0, 2+hop, 16, 4, 0, 0, Math.PI*2); ctx.fill();
  // tiny black shoes + orange snow-pant legs
  ctx.fillStyle=INK; ctx.beginPath(); rr(-11,-5,10,5,2); ctx.fill(); ctx.beginPath(); rr(1,-5,10,5,2); ctx.fill();
  ctx.strokeStyle=INK;    ctx.lineWidth=11; ctx.beginPath(); ctx.moveTo(-6,-26); ctx.lineTo(-6,-4); ctx.moveTo(6,-26); ctx.lineTo(6,-4); ctx.stroke();
  ctx.strokeStyle=ORANGE; ctx.lineWidth=8;  ctx.beginPath(); ctx.moveTo(-6,-26); ctx.lineTo(-6,-5); ctx.moveTo(6,-26); ctx.lineTo(6,-5); ctx.stroke();
  // arms: raised & waving (cheer) or hanging at the sides (disappointed)
  for (const s of [-1,1]) {
    const ax = cheer ? s*12 : s*13, ay = cheer ? -30 : -46;
    const hxx = cheer ? s*23 : s*15, hyy = cheer ? -52 - Math.abs(wave) : -22;
    ctx.strokeStyle=INK;    ctx.lineWidth=12; ctx.beginPath(); ctx.moveTo(ax,ay); ctx.lineTo(hxx,hyy); ctx.stroke();
    ctx.strokeStyle=ORANGE; ctx.lineWidth=9;  ctx.beginPath(); ctx.moveTo(ax,ay); ctx.lineTo(hxx,hyy); ctx.stroke();
    ctx.beginPath(); ctx.arc(hxx,hyy,6,0,Math.PI*2); fillOutline(FUR,2.4);          // brown mitten
  }
  // orange parka body + center zipper
  ctx.beginPath(); rr(-16,-52,32,30,12); fillOutline(ORANGE,3);
  ctx.strokeStyle=INK; ctx.lineWidth=2; ctx.beginPath(); ctx.moveTo(0,-49); ctx.lineTo(0,-24); ctx.stroke();
  // ---- HEAD: orange hood, brown fur ring, beige face, big white eyes ----
  const hy=-64;
  ctx.beginPath(); ctx.arc(0,hy,19,0,Math.PI*2); fillOutline(ORANGE,3);             // hood
  ctx.beginPath(); ctx.arc(0,hy,14,0,Math.PI*2); fillOutline(FUR,2.4);              // fur ring
  ctx.beginPath(); ctx.arc(0,hy,10,0,Math.PI*2); fillOutline('#ffe0b0',2);          // beige face
  ctx.beginPath(); ctx.ellipse(-3.7,hy-1,4.6,6.4,0,0,Math.PI*2); fillOutline('#fff',1.7);   // big white eyes
  ctx.beginPath(); ctx.ellipse( 3.7,hy-1,4.6,6.4,0,0,Math.PI*2); fillOutline('#fff',1.7);
  ctx.fillStyle=INK; ctx.beginPath(); ctx.arc(-1.4,hy-1,1.8,0,Math.PI*2); ctx.arc(1.4,hy-1,1.8,0,Math.PI*2); ctx.fill();  // pupils, toward center
  // hood drawstrings dangling onto the chest
  ctx.strokeStyle=INK; ctx.lineWidth=2; ctx.beginPath(); ctx.moveTo(-3,hy+11); ctx.lineTo(-3,hy+18); ctx.moveTo(3,hy+11); ctx.lineTo(3,hy+18); ctx.stroke();
  ctx.restore();
}
// A crowd of Kennys flanking Larry — cheering (win) or arms-down disappointed (game over)
function drawCrowd(centerX, groundY, t, cheer=true) {
  const spots = [-235,-198,-160,-122, 82,118,156,196,236];   // gap in the middle for Larry
  spots.forEach((dx, i) => {
    ctx.save();
    ctx.translate(centerX + dx, groundY + ((i*13)%9) - 2);   // slight depth jitter
    const sc = 0.82 + ((i*7)%5)/24;
    ctx.scale(sc, sc);
    drawKenny(t, i*1.27, cheer);
    ctx.restore();
  });
}
// Ducked head for the dab: just hair, mullet, and a peek of shades (no face to smush)
function drawDabHead() {
  // skin
  ctx.beginPath(); ctx.arc(0,0,16,0,Math.PI*2); fillOutline('#ffce9c',3);
  // brown hair covering most of the head (back/top)
  ctx.beginPath(); ctx.arc(0,0,16.5, Math.PI*0.78, Math.PI*2.08, false); ctx.closePath(); fillOutline('#5b3d24',2.5);
  // mullet flowing down the back
  ctx.beginPath(); ctx.moveTo(-9,7); ctx.quadraticCurveTo(-25,13,-23,33);
  ctx.quadraticCurveTo(-17,42,-6,36); ctx.quadraticCurveTo(-11,15,3,11); ctx.closePath(); fillOutline('#5b3d24',2.5);
  // orange shades peeking on the lower face (so you know it's Larry)
  ctx.beginPath(); rr(2,2,13,7,3); fillOutline('#ff9a3c',2.2);
}
function drawBlock(b) {
  local(b, () => {
    const w = b.w, h = b.h;
    if (b.mat === 'stone') {                                   // immovable stone footing
      ctx.beginPath(); rr(-w/2,-h/2,w,h,4); fillOutline('#9aa0a8', 3);
      ctx.strokeStyle = 'rgba(28,21,48,.28)'; ctx.lineWidth = 1.5;
      for (let y=-h/2+13; y<h/2-4; y+=15){ ctx.beginPath(); ctx.moveTo(-w/2+3,y); ctx.lineTo(w/2-3,y); ctx.stroke(); }
      ctx.fillStyle='rgba(255,255,255,.2)'; ctx.fillRect(-w/2+3,-h/2+4,4,h-8);
      return;
    }
    if (b.mat === 'metal') {                                   // heavy RED construction girder
      ctx.beginPath(); rr(-w/2,-h/2,w,h,3); fillOutline('#d8352b', 3);
      ctx.fillStyle='rgba(255,255,255,.28)'; ctx.fillRect(-w/2+2,-h/2+2,w-4,3);    // top highlight
      ctx.fillStyle='rgba(0,0,0,.22)';       ctx.fillRect(-w/2+2, h/2-5,w-4,3);    // bottom shade (I-beam flange)
      ctx.fillStyle='#3a1410';                                                     // rivets along the beam
      const along = (w>=h), n = Math.max(2, Math.floor((along?w:h)/16));
      for (let i=0;i<n;i++){ const t=-((along?w:h)/2)+8 + i*((along?w:h)-16)/(n-1||1);
        ctx.beginPath(); ctx.arc(along?t:0, along?0:t, 1.7, 0, Math.PI*2); ctx.fill(); }
      return;
    }
    // ---- plain wooden plank (classic Angry-Birds): flat board, wood-brown, light grain ----
    ctx.beginPath(); rr(-w/2,-h/2,w,h,3); fillOutline('#cf9b54', 3);
    ctx.strokeStyle = 'rgba(120,72,28,.5)'; ctx.lineWidth = 1.4;
    if (w >= h) { for (let yy=-h/2+5; yy<h/2-3; yy+=6){ ctx.beginPath(); ctx.moveTo(-w/2+4,yy); ctx.lineTo(w/2-4,yy); ctx.stroke(); } }
    else        { for (let xx=-w/2+5; xx<w/2-3; xx+=6){ ctx.beginPath(); ctx.moveTo(xx,-h/2+4); ctx.lineTo(xx,h/2-4); ctx.stroke(); } }
    ctx.fillStyle='rgba(255,255,255,.18)'; if (w>=h) ctx.fillRect(-w/2+4,-h/2+3,w-8,2); else ctx.fillRect(-w/2+3,-h/2+4,2,h-8);
  });
}
function drawCan(can) {
  local(can, () => {
    const w=42, h=74;
    ctx.beginPath(); rr(-w/2,-h/2,w,h,6);
    fillOutline(can.knocked ? '#9aa0a6' : `hsl(${can.hue},88%,55%)`, 3);
    // big white label taking up most of the can
    ctx.beginPath(); rr(-w/2+2,-26,w-4,52,4); ctx.fillStyle='#fff'; ctx.fill();
    ctx.strokeStyle=INK; ctx.lineWidth=2; ctx.stroke();
    ctx.fillStyle='#e23b54'; ctx.fillRect(-w/2+2,-2,w-4,10);    // red stripe
    // BIG bold BEER
    ctx.fillStyle=INK; ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.font='900 16px system-ui'; ctx.fillText('BEER',0,-13);
    ctx.fillStyle='#ffd84a'; ctx.font='900 13px system-ui'; ctx.fillText('★',0,16);
    // rim highlight + reset baseline
    ctx.fillStyle='rgba(255,255,255,.45)'; ctx.fillRect(-w/2+4,-h/2+5,4,h-10);
    ctx.textBaseline='alphabetic';
  });
}
function drawPowerGauge() {
  if (!dragging || !dragWorld) return;
  const dist = clamp(Vector.magnitude(Vector.sub(sled.position, dragWorld)), 0, MAX_DRAG);
  const t = dist / MAX_DRAG;
  const sx = sled.position.x, sy = sled.position.y - 52;
  // throttle bar above the sled
  ctx.fillStyle='rgba(0,0,0,.35)'; rr(sx-60, sy-9, 120, 16, 8); ctx.fill();
  ctx.fillStyle=`rgb(${90+t*165},${190-t*150},70)`; rr(sx-57, sy-6, 114*t, 10, 5); ctx.fill();
  // aim arrow along the ground
  ctx.strokeStyle='rgba(20,20,20,.5)'; ctx.lineWidth=4; ctx.beginPath();
  ctx.moveTo(dragWorld.x, sled.position.y); ctx.lineTo(sled.position.x, sled.position.y); ctx.stroke();
  ctx.fillStyle=`rgb(${90+t*165},${190-t*150},70)`;
  const ax = sled.position.x + 30 + t*60, ay = sled.position.y;
  ctx.beginPath(); ctx.moveTo(ax,ay); ctx.lineTo(ax-16,ay-9); ctx.lineTo(ax-16,ay+9); ctx.closePath(); ctx.fill();
  // mph readout
  const v0 = dist * POWER, mph = Math.round(v0 / 16.4 * 60);
  ctx.fillStyle='#fff'; ctx.font='bold 24px system-ui'; ctx.textAlign='center';
  ctx.fillText(mph + ' mph', sx, sy - 18);
  // ---- predicted flight arc off the lip (real physics: lip speed ≈ EFF×launch) ----
  const vlip = v0 * LAUNCH_EFF, gStep = 0.275 * engine.gravity.y;
  let px = LIP.x, py = LIP.y, vx = vlip*Math.cos(RAMP.theta), vy = -vlip*Math.sin(RAMP.theta);
  ctx.fillStyle = 'rgba(255,255,255,.85)';
  for (let i = 0; i < 90; i++) {
    px += vx; py += vy; vy += gStep; vx *= 0.9994; vy *= 0.9994;
    if (py > GROUND_Y) break;
    if (i % 2 === 0) { ctx.beginPath(); ctx.arc(px, py, 4, 0, Math.PI*2); ctx.fill(); }
  }
}
function drawParticles(){ for(const p of burstP){ ctx.globalAlpha=Math.max(0,p.life);
  ctx.fillStyle=p.c; ctx.beginPath(); ctx.arc(p.x,p.y,3,0,Math.PI*2); ctx.fill(); } ctx.globalAlpha=1; }
function drawSnow(){ ctx.fillStyle='rgba(255,255,255,.85)';
  for(const f of snow){ ctx.beginPath(); ctx.arc(f.x,f.y,f.r,0,Math.PI*2); ctx.fill(); } }

// ---- Loop ----
// FIXED-TIMESTEP physics: Matter velocities & our tuned constants are per-step (60/s), so we
// MUST advance the sim at a constant rate regardless of the monitor's refresh. (Stepping with
// raw frame dt made the sled fly ~2× farther on a 120/144 Hz display — straight over the towers.)
const STEP = 1000/60;
let acc = 0, last = performance.now();
function physicsStep() {
  if (state !== 'fly' || gameOver) return;
  if (!celebrating) {
    // airborne = clearly up in the air AND not touching anything. (Both are needed:
    // a resting/bouncing sled's contact flickers, so "not touching" alone lets it
    // pump itself into an endless ground cartwheel.)
    const airborne = sled.position.y < GROUND_Y - 55 &&
                     Query.collides(sled, world.bodies.filter(b => b !== sled)).length === 0;
    // crazy backflip kick the instant it leaves the lip
    if (!launchBoosted && airborne && sled.position.x > LIP.x - 10 && sled.position.y < GROUND_Y - 45) {
      const dir = sled.angularVelocity <= 0 ? -1 : 1;
      Body.setAngularVelocity(sled, sled.angularVelocity + dir * 0.05);   // a flip kick (gentler so you can still aim)
      launchBoosted = true;
    }
    // air control — ONLY while airborne; once he touches down, controls stop
    if (airborne) {
      const AIR = 0.004, SPIN_CAP = 0.26;
      if (keys.left)  Body.setAngularVelocity(sled, Math.max(-SPIN_CAP, sled.angularVelocity - AIR));
      if (keys.right) Body.setAngularVelocity(sled, Math.min( SPIN_CAP, sled.angularVelocity + AIR));
    }
    if (prevAirborne && !airborne && sled.velocity.y > 3) sndThud();   // landing
    prevAirborne = airborne;
  }
  Engine.update(engine, STEP);
  // ground brake: AFTER it has flown (launchBoosted) and dropped back near the snow, scrub its
  // slide/spin so it doesn't skate forever. Gated on launchBoosted so it never brakes the runway launch.
  if (launchBoosted && state === 'fly' && !celebrating && sled.position.y > GROUND_Y - 44) {
    Body.setVelocity(sled, { x: sled.velocity.x * 0.86, y: sled.velocity.y });
    Body.setAngularVelocity(sled, sled.angularVelocity * 0.85);
  }
  checkCans();
  // transition beat: after the last can falls, let the sled finish flying & settle,
  // then Larry hops off. (Hold off respawn so he doesn't get teleported back to the start.)
  if (winPending && !celebrating) {
    winT += STEP;
    // wait for the dust to settle — sled down AND all cans done wobbling — before Larry hops off
    if (winT > 700 && (sceneSettled() || winT > 4500)) startCelebration();
  }
  if (!celebrating && !winPending) {
    if (Vector.magnitude(sled.velocity) > 5 && sled.position.y > GROUND_Y - 70)
      spray(sled.position.x - 34, sled.position.y + 8);
    maybeRespawn(STEP);
  }
}
function loop(now) {
  const frame = Math.min(100, now - last); last = now;       // clamp huge gaps (backgrounded tab)
  acc += frame;
  let n = 0;
  while (acc >= STEP && n < 5) { physicsStep(); acc -= STEP; n++; }   // cap to avoid spiral of death
  if (acc >= STEP) acc = 0;                                  // we're behind; drop the backlog
  // celebration: rain confetti (and finale fireworks) — time-based so it's FPS-independent
  if (celebrating) {
    celebrateT += frame;
    if (Math.random() < (celebrateBig ? 0.95 : 0.55)) confetti(cam.x + Math.random()*VW, cam.y - 10, celebrateBig ? 5 : 3);
    if (celebrateBig && Math.random() < 0.22) confetti(cam.x + Math.random()*VW, cam.y + Math.random()*VH*0.5, 14);
  }
  if (gameOver) overT += frame;
  stepParticles(); stepSnow(); stepCamera();

  // clear full backing (letterbox bars)
  ctx.setTransform(view.dpr, 0, 0, view.dpr, 0, 0);
  ctx.fillStyle = '#0b1a2b'; ctx.fillRect(0, 0, canvas.width/view.dpr, canvas.height/view.dpr);
  // establish uniform game transform (scaled + centred), clipped to the play area
  ctx.setTransform(view.dpr*view.scale, 0, 0, view.dpr*view.scale, view.offX*view.dpr, view.offY*view.dpr);
  ctx.save();
  ctx.beginPath(); ctx.rect(0, 0, VW, VH); ctx.clip();

  // screen-space sky
  sky();
  mountains(540, '#cfe2f2', 0.20);
  mountains(470, '#bcd6ec', 0.34);
  // world-space (camera) layer
  ctx.save(); ctx.translate(-cam.x, -cam.y);
  ground();
  for (const x of treeXs) tree(x, 0.9 + (x%7)/14);
  drawRamp();
  for (const b of blocks) drawBlock(b);
  for (const can of cans) drawCan(can);
  drawSnowmobile(sled);                                // parked (empty) during celebration
  if (celebrating) {
    drawCrowd(sled.position.x - 96, GROUND_Y, celebrateT);     // Kenny audience behind, cheering
    drawStandingLarry(sled.position.x - 96, GROUND_Y, celebrateT);
  } else if (gameOver) {
    drawCrowd(sled.position.x + 70, GROUND_Y, overT, false);   // crowd looking on, disappointed
    drawWreck(sled.position.x + 70, GROUND_Y, overT);          // Larry wiped out
  }
  drawParticles();
  drawPowerGauge();
  ctx.restore();
  // screen-space snow on top
  drawSnow();

  ctx.restore();   // drop clip

  requestAnimationFrame(loop);
}

resize();
buildLevel();
requestAnimationFrame(loop);
</script>
